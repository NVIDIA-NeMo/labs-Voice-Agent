name: Review command migration

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  claude-review:
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_claude_review.yml@fe0ff3bbe10790c51273ee3c1189b3c0497bf860 # v1.8.5
    with:
      model: ${{ vars.CLAUDE_MODEL }}
      prompt: |
        You are doing a light code review. Keep it concise and actionable.

        Focus ONLY on:
        - Critical bugs or logic errors
        - Typos in code, comments, or strings
        - Missing or insufficient test coverage for changed code
        - Outdated or inaccurate documentation affected by the changes

        Do NOT comment on:
        - Style preferences or formatting
        - Minor naming suggestions
        - Architectural opinions or refactoring ideas
        - Performance unless there is a clear, measurable issue

        Provide feedback using inline comments for specific code suggestions.
        Use top-level comments for general observations.

        IMPORTANT: Do NOT approve the pull request. Only leave comments.

        It's perfectly acceptable to not have anything to comment on.
        If you do not have anything to comment on, post "LGTM".
    secrets:
      NVIDIA_INFERENCE_URL: ${{ secrets.NVIDIA_INFERENCE_URL }}
      NVIDIA_INFERENCE_KEY: ${{ secrets.NVIDIA_INFERENCE_KEY }}
  redirect-to-review:
    name: Redirect to /review
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event.comment.body == '/claude review' ||
       github.event.comment.body == '/claude strict-review')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.issue.number }}
      RETIRED_COMMAND: ${{ github.event.comment.body == '/claude strict-review' && '/claude strict-review' || '/claude review' }}
      REVIEW_COMMAND: ${{ github.event.comment.body == '/claude strict-review' && '/review mode=strict' || '/review' }}
    steps:
      - name: Explain the replacement command
        env:
          NOTICE: |
            @${{ github.event.comment.user.login }} `${{ env.RETIRED_COMMAND }}` has been retired. Pull-request reviews now run through `/review`; comment this instead:

            ```
            ${{ env.REVIEW_COMMAND }}
            ```

            Add `model=claude` to keep a Claude reviewer (the default is `model=codex`). `mode=light|strict` selects the review depth. Comment `/review help` for all options.
        run: gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file - <<< "$NOTICE"
