name: Test Template
description: Run a Voice-Agent CI script inside the local CI container image.

inputs:
  image:
    description: Docker image to run.
    required: true
  script:
    description: Script basename without .sh.
    required: true
  script-dir:
    description: Directory containing the script.
    required: true
  timeout:
    description: Max runtime in minutes.
    required: false
    default: "30"
  coverage-prefix:
    description: Coverage artifact prefix.
    required: false
    default: unit-test
  test-data-path:
    description: Host path containing shared CI test data and HF_HOME cache. If empty, no test data is mounted.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Run test script
      shell: bash
      run: |
        set -xeuo pipefail
        VOLUME_ARGS=()
        if [[ -n "${{ inputs.test-data-path }}" ]]; then
          VOLUME_ARGS+=(
            --volume "${{ inputs.test-data-path }}:/home/TestData"
            --env HF_HOME=/home/TestData/HF_HOME
            --env NEMO_HOME=/home/TestData/nemo_home
            --env TRANSFORMERS_OFFLINE=1
            --env HF_HUB_OFFLINE=1
          )
        fi
        docker run --rm \
          --runtime=nvidia --gpus all \
          --shm-size=32g \
          --workdir /opt/Voice-Agent \
          --env COVERAGE_FILE=/opt/Voice-Agent/.coverage \
          --volume "${{ github.workspace }}:/opt/Voice-Agent" \
          "${VOLUME_ARGS[@]}" \
          "${{ inputs.image }}" \
          timeout "$(( ${{ inputs.timeout }} * 60 ))s" \
          bash "${{ inputs.script-dir }}/${{ inputs.script }}.sh"

    - name: Generate coverage report
      shell: bash
      if: always()
      run: |
        set -xeuo pipefail
        VOLUME_ARGS=()
        if [[ -n "${{ inputs.test-data-path }}" ]]; then
          VOLUME_ARGS+=(
            --volume "${{ inputs.test-data-path }}:/home/TestData"
            --env HF_HOME=/home/TestData/HF_HOME
            --env NEMO_HOME=/home/TestData/nemo_home
            --env TRANSFORMERS_OFFLINE=1
            --env HF_HUB_OFFLINE=1
          )
        fi
        docker run --rm \
          --runtime=nvidia --gpus all \
          --shm-size=32g \
          --workdir /opt/Voice-Agent \
          --env COVERAGE_FILE=/opt/Voice-Agent/.coverage \
          --volume "${{ github.workspace }}:/opt/Voice-Agent" \
          "${VOLUME_ARGS[@]}" \
          "${{ inputs.image }}" \
          bash -c "coverage combine || true; coverage report -i || true; coverage xml -i || true"

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-${{ inputs.coverage-prefix }}-${{ inputs.script }}-${{ github.run_id }}
        path: |
          .coverage
          coverage.xml
        include-hidden-files: true
        if-no-files-found: ignore
