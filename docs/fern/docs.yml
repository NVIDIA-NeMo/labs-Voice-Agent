instances:
  - url: https://nemo-voice-agent.docs.buildwithfern.com/nemo/voice-agent
    custom-domain: docs.nvidia.com/nemo/voice-agent
    multi-source: true

title: NeMo Voice Agent

global-theme: nvidia

metadata:
  canonical-host: "docs.nvidia.com/nemo/voice-agent"

libraries:
  nemo-voice-agent:
    input:
      git: https://github.com/NVIDIA-NeMo/Voice-Agent
      subpath: nemo_voice_agent
    output:
      path: ./product-docs/nemo-voice-agent/Full-Library-Reference
    lang: python
  nemo-voice-agent-local:
    input:
      path: ../../nemo_voice_agent
    output:
      path: ./product-docs/nemo-voice-agent/Full-Library-Reference
    lang: python

versions:
  - display-name: Nightly
    slug: nightly
    path: ./versions/nightly.yml
    availability: beta

redirects:
  - source: "/nemo/voice-agent/index.html"
    destination: "/nemo/voice-agent/nightly"
  - source: "/nemo/voice-agent/nightly/index.html"
    destination: "/nemo/voice-agent/nightly"

logo:
  href: /nemo/voice-agent
  right-text: NeMo Voice Agent

navbar-links:
  - type: github
    value: https://github.com/NVIDIA-NeMo/Voice-Agent

experimental:
  basepath-aware: true
