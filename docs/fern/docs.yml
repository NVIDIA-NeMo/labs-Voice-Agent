instances:
  - url: https://nemo-labs-voice-agent.docs.buildwithfern.com/nemo/labs-voice-agent
    custom-domain: docs.nvidia.com/nemo/labs-voice-agent
    multi-source: true

title: NeMo Labs Voice Agent

global-theme: nvidia

metadata:
  canonical-host: "docs.nvidia.com/nemo/labs-voice-agent"

libraries:
  nemo-voice-agent:
    input:
      git: https://github.com/NVIDIA-NeMo/labs-Voice-Agent
      subpath: nemo_voice_agent
    output:
      path: ./product-docs/nemo-labs-voice-agent/Full-Library-Reference
    lang: python
  # Local development only: temporarily uncomment this block before running
  # `npm run generate:library:local`, then comment it out again before using
  # `fern check`, `fern docs dev`, preview, or publish commands.
  # nemo-voice-agent-local:
  #   input:
  #     path: ../../nemo_voice_agent
  #   output:
  #     path: ./product-docs/nemo-voice-agent/Full-Library-Reference
  #   lang: python

versions:
  - display-name: Nightly
    slug: nightly
    path: ./versions/nightly.yml
    availability: beta

redirects:
  - source: "/nemo/labs-voice-agent/index.html"
    destination: "/nemo/labs-voice-agent/nightly"
  - source: "/nemo/labs-voice-agent/nightly/index.html"
    destination: "/nemo/labs-voice-agent/nightly"

logo:
  href: /nemo/labs-voice-agent
  right-text: NeMo Labs Voice Agent

navbar-links:
  - type: github
    value: https://github.com/NVIDIA-NeMo/labs-Voice-Agent

experimental:
  basepath-aware: true
