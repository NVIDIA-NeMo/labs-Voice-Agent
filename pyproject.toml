[project]
name = "nemo_voice_agent"
version = "0.1.0"
description = "An open-source real-time voice agent pipeline built on Pipecat and NeMo speech models."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    # Deep learning core (CUDA 13.0 wheels; see [tool.uv.sources] below)
    "torch",
    "torchvision",
    "torchaudio",
    # NeMo speech stack (ASR + TTS models)
    "nemo-toolkit[asr,tts]>=2.7.3",
    # Real-time voice pipeline framework
    "pipecat-ai==0.0.98",
    # LLM backends
    "transformers>=5.8.0",
    "vllm>=0.24.0",
    "openai",
    # TTS backends and audio processing
    "kokoro",
    "spacy",       # misaki[en] runtime need, pulled in directly since we override
    "num2words",   # misaki's `en` extra to drop its GPL-3.0 phonemizer-fork/espeakng_loader deps
    # misaki.en.G2P unconditionally loads this spaCy pipeline (tokenizer/tagger) on
    # every construction and self-installs it via `pip` if missing. Pin it explicitly
    # (MIT-licensed, not on PyPI so it needs a direct wheel URL) so `uv sync` doesn't
    # keep stripping it and misaki doesn't fall back to an unpinned network install.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "silero-vad",
    "onnxruntime",
    "kaldialign",
    # Web / API / client
    "fastapi",
    "uvicorn",
    "websockets",
    # Utilities
    "python_weather",
    "python-dotenv",
    "loguru",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-exporter-otlp-proto-http",
    # Riva client
    "nvidia-riva-client==2.21.1",
    "g2p-en>=2.1.0",
]

[project.optional-dependencies]
# Dev tools: linters, formatters, test runners
dev = [
    "black>=24",
    "isort>=5",
    "pytest>=8",
    "pytest",
    "pre-commit",
]

[project.urls]
Homepage = "https://github.com/NVIDIA-NeMo/Voice-Agent"
Repository = "https://github.com/NVIDIA-NeMo/Voice-Agent"
Issues = "https://github.com/NVIDIA-NeMo/Voice-Agent/issues"

[tool.isort]
profile = "black"  # black-compatible
line_length = 119  # should match black parameters
ignore_whitespace = true  # ignore whitespace for compatibility with the initial style
py_version = 310  # python 3.10 as a target version
known_first_party = ["nemo"]  # FIRSTPARTY section
known_third_party = ["nemo_text_processing", "examples", "scripts"]  # THIRDPARTY section
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
default_section = "THIRDPARTY"
extend_skip = ["setup.py", "docs/source/conf.py"]


[tool.black]
line_length = 119
skip_string_normalization = true
# major year version is stable, see details in
# https://black.readthedocs.io/en/stable/the_black_code_style/index.html
# `required_version` is necessary for consistency (other `black` versions will fail to reformat files)
required_version = "24"
target-version = ['py310', 'py311', 'py312', 'py313']
# by default exclude Jupyter Notebooks (but can be reformated when passed directly)
extend-exclude = '''
(
  \.ipynb
  | \.ipynb_checkpoints
)
'''

[build-system]
requires = ["setuptools>=79"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nemo_voice_agent*"]
exclude = ["tests*", "evaluation*", "examples*", "client*"]

# ---------------------------------------------------------------------------
# uv configuration — pins PyTorch and vLLM wheels to the CUDA 13.0 index.
# vLLM publishes matching CUDA 13 wheels on the PyTorch index.
# Change the index URL for CPU-only or different CUDA versions:
#   - CPU:       https://download.pytorch.org/whl/cpu
#   - CUDA 12.4: https://download.pytorch.org/whl/cu124
#   - CUDA 12.8: https://download.pytorch.org/whl/cu128
#   - CUDA 13.0: https://download.pytorch.org/whl/cu130  (default here)
# ---------------------------------------------------------------------------
[tool.uv]
# Always use uv's own managed Python (downloaded to ~/.local/share/uv/python/).
# Prevents picking up system/conda Python which can cause build-toolchain
# mismatches when compiling C extensions from source (e.g. cdifflib).
python-preference = "only-managed"

# Tell uv to select the CUDA 13 variant for torch, torchvision, torchaudio,
# and any package that declares a torch-backend-aware source. This replaces
# the manual [[tool.uv.index]] + [tool.uv.sources] plumbing for torch.
torch-backend = "cu130"

# Force patched versions for known CVEs
override-dependencies = [
    "protobuf==5.29.6",
    "numba==0.65.0",
    "transformers>=5.8.0",
    "setuptools>=79.0.0",
    # Drop kokoro's `misaki[en]` extra request: it pulls in phonemizer-fork
    # (GPL-3.0) and espeakng_loader (bundles a compiled GPL-3.0 espeak-ng
    # binary), which are incompatible with this project's Apache-2.0 license.
    # spacy/num2words (misaki's other `en` extras, both permissively licensed
    # and needed for its core dictionary-based G2P) are added as direct deps
    # above. See nemo_voice_agent/pipecat/services/nemo/_espeak_gpl_shim.py.
    "misaki==0.9.4",
]
