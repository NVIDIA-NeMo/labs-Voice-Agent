[project]
name = "nemo-voice-agent"
description = "An open-source real-time voice agent pipeline built on Pipecat and NeMo speech models."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dynamic = ["version"]
authors = [{ name = "NVIDIA", email = "nemo-toolkit@nvidia.com" }]
maintainers = [{ name = "NVIDIA", email = "nemo-toolkit@nvidia.com" }]
keywords = ["voice agent", "speech", "LLM", "NeMo", "Pipecat", "NVIDIA"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Deep learning core (CUDA 13.0 wheels; see [tool.uv.sources] below)
    "torch",
    "torchvision",
    "torchaudio",

    # NeMo speech stack (ASR + TTS models)
    "nemo-toolkit[asr,tts]>=2.7.3",

    # Real-time voice pipeline framework
    "pipecat-ai==0.0.98",

    # LLM backends
    "transformers>=5.8.0",
    "vllm>=0.20.0",
    "openai",

    # TTS backends and audio processing
    "kokoro",
    "silero-vad",
    "onnxruntime",
    "kaldialign",

    # Web / API / client
    "fastapi",
    "uvicorn",
    "websockets",

    # Utilities
    "python_weather",
    "python-dotenv",
    "loguru",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-exporter-otlp-proto-http",

    # Riva client
    "nvidia-riva-client==2.21.1",
]

[project.optional-dependencies]
# Dev tools: linters, formatters, test runners
dev = [
    "pytest>=8",
    "pytest",
    "pre-commit",
    "ruff>=0.9.9",
]

[dependency-groups]
test = [
    "coverage[toml]>=7.8.1",
    "pytest>=8",
    "pytest-timeout>=2.4.0",
]
dev = [
    "pre-commit",
    "ruff>=0.9.9",
]
docs = []
build = [
    "build",
    "setuptools>=79",
    "wheel",
]

[project.urls]
Homepage = "https://github.com/NVIDIA-NeMo/Voice-Agent"
Repository = "https://github.com/NVIDIA-NeMo/Voice-Agent"
Issues = "https://github.com/NVIDIA-NeMo/Voice-Agent/issues"

[build-system]
requires = ["setuptools>=79"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nemo_voice_agent*"]
exclude = ["tests*", "evaluation*", "examples*", "client*"]

[tool.setuptools.package-data]
nemo_voice_agent = [
    "evaluation/data/**/*.json",
    "evaluation/data/**/*.jsonl",
    "evaluation/data/**/*.md",
]

[tool.setuptools.dynamic]
version = { attr = "nemo_voice_agent.package_info.__version__" }

[tool.pytest.ini_options]
addopts = "--verbose --strict-markers"
testpaths = ["tests"]
markers = [
    "unit: in-process tests that do not require GPU hardware, external services, or live model serving",
    "functional: tests that exercise runtime integrations, model serving, GPU execution, or end-to-end flows",
    "gpu: tests requiring GPU hardware",
    "slow: tests that are too slow for the default unit lane",
    "skipduringci: tests intentionally skipped in CI",
    "pleasefixme: tests that are broken and need fixing",
]

[tool.coverage.run]
concurrency = ["thread", "multiprocessing"]
source = ["nemo_voice_agent"]
omit = [
    "tests/*",
    ".venv/*",
]

[tool.coverage.paths]
source = [
    ".",
    "/opt/Voice-Agent/",
    "/home/runner/work/Voice-Agent/Voice-Agent",
]

# ---------------------------------------------------------------------------
# uv configuration — pins PyTorch and vLLM wheels to the CUDA 13.0 index.
# vLLM publishes matching CUDA 13 wheels on the PyTorch index.
# Change the index URL for CPU-only or different CUDA versions:
#   - CPU:       https://download.pytorch.org/whl/cpu
#   - CUDA 12.4: https://download.pytorch.org/whl/cu124
#   - CUDA 12.8: https://download.pytorch.org/whl/cu128
#   - CUDA 13.0: https://download.pytorch.org/whl/cu130  (default here)
# ---------------------------------------------------------------------------
[tool.uv]
# Always use uv's own managed Python (downloaded to ~/.local/share/uv/python/).
# Prevents picking up system/conda Python which can cause build-toolchain
# mismatches when compiling C extensions from source (e.g. cdifflib).
python-preference = "only-managed"

# Tell uv to select the CUDA 13 variant for torch, torchvision, torchaudio,
# and any package that declares a torch-backend-aware source. This replaces
# the manual [[tool.uv.index]] + [tool.uv.sources] plumbing for torch.
torch-backend = "cu130"

# Force patched versions for known CVEs
override-dependencies = [
    "protobuf==5.29.6",
    "numba==0.65.0",
    "transformers>=5.8.0",
    "setuptools>=79.0.0"
]
