[project]
name = "nemo-voice-agent"
description = "An open-source real-time voice agent pipeline built on Pipecat and NeMo speech models."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dynamic = ["version"]
authors = [{ name = "NVIDIA", email = "nemo-toolkit@nvidia.com" }]
maintainers = [{ name = "NVIDIA", email = "nemo-toolkit@nvidia.com" }]
keywords = ["voice agent", "speech", "LLM", "NeMo", "Pipecat", "NVIDIA"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Deep learning core (CUDA 13.0 wheels; see [tool.uv.sources] below)
    "torch",
    "torchvision",
    "torchaudio",
    # NeMo speech stack (ASR + TTS models). Pinned to a NeMo Speech main commit because no PyPI release can
    # load nvidia/Nemotron-3-Diarization yet: 3.0.0 lacks its RoPE TransformerEncoder and 10 ms high-resolution
    # Sortformer outputs. Move back to a version specifier once a release that includes them ships.
    "nemo-toolkit[asr,tts] @ git+https://github.com/NVIDIA-NeMo/Speech.git@e5d79d5a49cbec49d79440b0070aac0c32a8dbb8",
    # NeMo's TTS package imports nemo.collections.speechlm2, which needs peft; NeMo only lists it under the
    # speechlm2 extra, so importing our TTS services fails without it.
    "peft>=0.18.1",
    # Real-time voice pipeline framework.
    # NOTE: deliberately NOT the `[nvidia]` extra — it requires protobuf>=6.31.1,
    # which nemo-toolkit 2.7.x forbade (it pinned protobuf~=5.29.5; the pinned NeMo
    # Speech commit no longer constrains protobuf). We supply the Riva client
    # ourselves below. See the nvidia-riva-client comment for the details.
    "pipecat-ai[websocket,tracing]==1.6.0",
    # LLM backends
    "transformers>=5.8.0",
    # Capped to the vLLM releases that pin torch==2.11.0: the torch override below hides vLLM's exact torch pin
    # from the resolver, so a newer vLLM would lock against a torch it was not built for. Move both together.
    "vllm>=0.24.0,<0.27",
    "openai",
    # TTS backends and audio processing
    "kokoro",
    "spacy",       # misaki[en] runtime need, pulled in directly since we override
    "num2words",   # misaki's `en` extra to drop its GPL-3.0 phonemizer-fork/espeakng_loader deps
    # silero-vad is no longer a direct dep: pipecat >=1.0 bundles
    # audio/vad/data/silero_vad.onnx and runs it through onnxruntime, which is
    # now a pipecat core dependency. Only pipecat's SileroVADAnalyzer is used.
    "onnxruntime~=1.24.3",
    "kaldialign",
    # Web / API / client
    "fastapi",
    "uvicorn",
    "websockets",
    # Utilities
    # 2.2.3 added wttr.in weather code 149 (smoky haze); older versions raise on it.
    "python_weather>=2.2.3",
    "python-dotenv",
    "loguru",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-exporter-otlp-proto-http",
    # Riva client. Must be >=2.25.1: that release changed the SynthesizeOnline
    # RPC from unary_stream to stream_stream, and pipecat >=1.0 feeds it a
    # request generator. Against 2.21.1's unary stub gRPC tries to serialize the
    # generator itself and the call dies with
    # 'StatusCode.INTERNAL: Exception serializing request!'.
    # This is what forces protobuf 6.x below — riva's gencode from 2.25.1 on
    # declares a 6.31.1 runtime.
    "nvidia-riva-client>=2.26.0,<3",
    # protobuf 6 needs a grpcio-tools that accepts it; <1.72 caps at protobuf 5.
    "grpcio-tools>=1.75,<1.83",
    "g2p-en>=2.1.0",
]

[project.optional-dependencies]
# Dev tools: linters, formatters, test runners
dev = [
    "pytest>=8",
    "pytest",
    "pre-commit",
    "ruff>=0.9.9",
]

[dependency-groups]
test = [
    "coverage[toml]>=7.8.1",
    "pytest>=8",
    "pytest-timeout>=2.4.0",
]
dev = [
    "pre-commit",
    "ruff>=0.9.9",
]
docs = []
build = [
    "build",
    "setuptools>=79",
    "wheel",
]

[project.urls]
Homepage = "https://github.com/NVIDIA-NeMo/labs-Voice-Agent"
Repository = "https://github.com/NVIDIA-NeMo/labs-Voice-Agent"
Issues = "https://github.com/NVIDIA-NeMo/labs-Voice-Agent/issues"

[build-system]
requires = ["setuptools>=79"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nemo_voice_agent*"]
exclude = ["tests*", "evaluation*", "examples*", "client*"]

[tool.setuptools.package-data]
nemo_voice_agent = [
    "evaluation/data/**/*.json",
    "evaluation/data/**/*.jsonl",
    "evaluation/data/**/*.md",
    "evaluation/data/**/*.yaml",
]

[tool.setuptools.dynamic]
version = { attr = "nemo_voice_agent.package_info.__version__" }

[tool.pytest.ini_options]
addopts = "--verbose --strict-markers"
testpaths = ["tests"]
markers = [
    "unit: in-process tests that do not require GPU hardware, external services, or live model serving",
    "functional: tests that exercise runtime integrations, model serving, GPU execution, or end-to-end flows",
    "gpu: tests requiring GPU hardware",
    "slow: tests that are too slow for the default unit lane",
    "skipduringci: tests intentionally skipped in CI",
    "pleasefixme: tests that are broken and need fixing",
]

[tool.coverage.run]
concurrency = ["thread", "multiprocessing"]
source = ["nemo_voice_agent"]
omit = [
    "tests/*",
    ".venv/*",
    "nemo_voice_agent/evaluation/scenarios/data/eva_airline/group_*.py",
    "nemo_voice_agent/evaluation/scenarios/data/tau2_airline/group_*.py",
    "nemo_voice_agent/evaluation/scenarios/data/tau2_retail/group_*.py",
    "nemo_voice_agent/evaluation/scenarios/data/tau2_telecom/group_*.py",
]

[tool.coverage.paths]
source = [
    ".",
    "/opt/Voice-Agent/",
    "/home/runner/work/Voice-Agent/Voice-Agent",
]

# ---------------------------------------------------------------------------
# uv configuration — pins PyTorch and vLLM wheels to the CUDA 13.0 index.
# vLLM publishes matching CUDA 13 wheels on the PyTorch index.
# Change the index URL for CPU-only or different CUDA versions:
#   - CPU:       https://download.pytorch.org/whl/cpu
#   - CUDA 12.4: https://download.pytorch.org/whl/cu124
#   - CUDA 12.8: https://download.pytorch.org/whl/cu128
#   - CUDA 13.0: https://download.pytorch.org/whl/cu130  (default here)
# ---------------------------------------------------------------------------
[tool.uv]
# Always use uv's own managed Python (downloaded to ~/.local/share/uv/python/).
# Prevents picking up system/conda Python which can cause build-toolchain
# mismatches when compiling C extensions from source (e.g. cdifflib).
python-preference = "only-managed"

# Tell uv to select the CUDA 13 variant for torch, torchvision, torchaudio,
# and any package that declares a torch-backend-aware source. This replaces
# the manual [[tool.uv.index]] + [tool.uv.sources] plumbing for torch.
torch-backend = "cu130"

# Force patched versions for known CVEs
override-dependencies = [
    # uv applies a git dependency's own [tool.uv.sources], and NeMo Speech main maps torch to its CPU wheel index
    # unless one of its cu12/cu13 extras is enabled. Re-declaring torch here drops that source, so torch keeps
    # resolving from PyPI with its CUDA 13 runtime wheels. Keep it equal to the locked vLLM's torch pin (see the
    # vllm dependency above).
    "torch==2.11.0",
    # Same mechanism: NeMo Speech main sources nltk from its v3.10.0-rc1 git tag, which lacks the downloader and
    # data-loading security fixes of the 3.10.0 release. Re-declaring it keeps nltk on the PyPI release.
    "nltk>=3.10.0",
    # protobuf 6.33.5 patches BOTH live advisories: CVE-2025-4565 (recursion DoS,
    # fixed 4.25.8/5.29.5/6.31.1) and CVE-2026-0994 (JSON recursion depth bypass,
    # fixed 5.29.6/6.33.5). Do NOT drop to 6.31.1-6.33.4 — those reintroduce the
    # second one. vllm excludes exactly that range too.
    # This override was added to ignore nemo-toolkit 2.7.x's protobuf~=5.29.5
    # pin (the pinned NeMo Speech commit has none). That pin was conservative:
    # protobuf runtimes are backward compatible with older gencode (a 6.x
    # runtime reads NeMo's 5.x-generated code fine); only the reverse fails.
    # Riva >=2.25.1 is required for TTS to work at all (see nvidia-riva-client
    # above) and its gencode mandates a 6.x runtime.
    "protobuf==6.33.5",
    "numba==0.65.0",
    "transformers>=5.8.0",
    "setuptools>=79.0.0",
    # Drop kokoro's `misaki[en]` extra request: it pulls in phonemizer-fork
    # (GPL-3.0) and espeakng_loader (bundles a compiled GPL-3.0 espeak-ng
    # binary), which are incompatible with this project's Apache-2.0 license.
    # spacy/num2words (misaki's other `en` extras, both permissively licensed
    # and needed for its core dictionary-based G2P) are added as direct deps
    # above. See nemo_voice_agent/pipecat/services/nemo/_espeak_gpl_shim.py.
    "misaki==0.9.4",
    "pillow>=12.2.0"
]

# g2p-en declares `distance` (GPL-3.0) in its metadata but never imports it (phantom
# dependency — verified: not referenced in g2p.py/expand.py/__init__.py). Override
# g2p-en's requires-dist to drop `distance` so it stays out of the resolved dependency
# graph, keeping the tree Apache-2.0-clean. g2p-en's real runtime deps are numpy/nltk/
# inflect only (all permissive). g2p-en itself provides the OOV G2P fallback for Kokoro
# TTS — see nemo_voice_agent/pipecat/services/nemo/_g2p_fallback.py.
[[tool.uv.dependency-metadata]]
name = "g2p-en"
version = "2.1.0"
requires-dist = ["numpy>=1.13.1", "nltk>=3.2.4", "inflect>=0.3.1"]
